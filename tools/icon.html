<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1024" height="1024"></canvas>
<script src="../dev/dolphin.js"></script>
<script>
// Appikonen ritas med samma delfinmodell som appen (tools/make-icons.js gör PNG-filerna)
function drawIcon(dev){
  const c=document.getElementById('c'), g=c.getContext('2d'), S=1024; g.clearRect(0,0,S,S);
  let bg=g.createLinearGradient(0,0,0,S); bg.addColorStop(0,'#1a1f5c'); bg.addColorStop(.55,'#0d1a4a'); bg.addColorStop(1,'#071233'); g.fillStyle=bg; g.fillRect(0,0,S,S);
  let gl=g.createRadialGradient(S*.68,S*.1,0,S*.68,S*.1,S*.75); gl.addColorStop(0,'rgba(124,92,255,.75)'); gl.addColorStop(.5,'rgba(90,70,220,.25)'); gl.addColorStop(1,'rgba(90,70,220,0)'); g.fillStyle=gl; g.fillRect(0,0,S,S);
  // havsyta längst ner
  let sea=g.createLinearGradient(0,S*.62,0,S); sea.addColorStop(0,'rgba(34,211,238,0)'); sea.addColorStop(1,'rgba(34,211,238,.28)'); g.fillStyle=sea; g.fillRect(0,S*.62,S,S*.38);
  // stjärnor
  const st=[[.18,.17,6],[.33,.11,4],[.12,.39,4],[.49,.23,5],[.58,.07,4],[.88,.48,4],[.3,.33,3],[.7,.36,3],[.06,.6,3],[.93,.22,3]];
  for(const [x,y,r] of st){ const sg=g.createRadialGradient(x*S,y*S,0,x*S,y*S,r*4); sg.addColorStop(0,'#fff'); sg.addColorStop(.25,'rgba(255,255,255,.8)'); sg.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=sg; g.beginPath(); g.arc(x*S,y*S,r*4,0,7); g.fill(); }
  // planet med ring
  const px=S*.78, py=S*.2, pr=S*.12;
  g.save(); g.translate(px,py); g.rotate(-.22);
  g.strokeStyle='#e8c27a'; g.lineWidth=S*.014; g.beginPath(); g.ellipse(0,0,pr*1.75,pr*.42,0,Math.PI,2*Math.PI); g.stroke(); g.restore();
  let pg=g.createRadialGradient(px-pr*.4,py-pr*.45,pr*.1,px,py,pr); pg.addColorStop(0,'#bdf3ff'); pg.addColorStop(.45,'#3ba7f0'); pg.addColorStop(1,'#2b3fb5'); g.fillStyle=pg; g.beginPath(); g.arc(px,py,pr,0,7); g.fill();
  g.save(); g.translate(px,py); g.rotate(-.22); g.strokeStyle='#f3d38c'; g.lineWidth=S*.014; g.beginPath(); g.ellipse(0,0,pr*1.75,pr*.42,0,0,Math.PI); g.stroke(); g.restore();
  // delfinen – hoppar snett uppåt, stjärten i ett uppslag
  { const gx=S*.47, gy=S*.53, gr=g.createRadialGradient(gx,gy,0,gx,gy,S*.42); gr.addColorStop(0,'rgba(90,220,255,.35)'); gr.addColorStop(1,'rgba(90,220,255,0)'); g.save(); g.translate(gx,gy); g.scale(1,.55); g.translate(-gx,-gy); g.fillStyle=gr; g.beginPath(); g.arc(gx,gy,S*.42,0,7); g.fill(); g.restore(); }
  DOLPH.draw(g,{pitch:-.2,yaw:0,elev:.3,bend:.12,A:.06,ph:4.4,fluke:.25,flap:.2},{x:S*.5,y:S*.55,k:S*.6,col:{back:'#3552b0',flank:'#62b7f5',belly:'#f2fbff',fin:'#2c46a0'},T:1.2,stars:true,caustics:false});
  // tärning
  g.save(); g.translate(S*.73,S*.79); g.rotate(.2); const d=S*.2, r=d*.2;
  g.shadowColor='rgba(0,0,0,.45)'; g.shadowBlur=S*.03; g.shadowOffsetY=S*.012;
  let dg=g.createLinearGradient(-d/2,-d/2,d/2,d/2); dg.addColorStop(0,'#ffffff'); dg.addColorStop(1,'#d9ecff'); g.fillStyle=dg;
  g.beginPath(); g.moveTo(-d/2+r,-d/2); g.arcTo(d/2,-d/2,d/2,d/2,r); g.arcTo(d/2,d/2,-d/2,d/2,r); g.arcTo(-d/2,d/2,-d/2,-d/2,r); g.arcTo(-d/2,-d/2,d/2,-d/2,r); g.fill();
  g.shadowColor='transparent'; g.fillStyle='#132457'; for(const [x,y] of [[-.26,-.26],[.26,-.26],[0,0],[-.26,.26],[.26,.26]]){ g.beginPath(); g.arc(x*d,y*d,d*.085,0,7); g.fill(); }
  g.restore();
  if(dev){ g.save(); g.fillStyle='#f59e0b'; g.fillRect(0,S*.78,S,S*.22); g.globalAlpha=.25; g.fillStyle='#fff'; for(let x=-S;x<S*2;x+=S*.09){ g.beginPath(); g.moveTo(x,S*.78); g.lineTo(x+S*.045,S*.78); g.lineTo(x+S*.045-S*.22,S); g.lineTo(x-S*.22,S); g.fill(); } g.restore();
    g.fillStyle='#1c1206'; g.font=`italic 800 ${S*.17}px system-ui, sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText('DEV',S/2,S*.895); }
  return c.toDataURL('image/png');
}
</script></body></html>
