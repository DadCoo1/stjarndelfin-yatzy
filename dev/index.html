<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sdk.scdn.co https://open.spotify.com https://*.spotifycdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.scdn.co https://*.spotifycdn.com https://*.spotify.com; media-src 'self' blob: mediastream:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://accounts.spotify.com https://api.spotify.com https://*.spotify.com wss://*.spotify.com https://*.scdn.co https://*.spotifycdn.com http://127.0.0.1:9000 ws://127.0.0.1:9000 https://sv.wiktionary.org https://no.wiktionary.org https://nn.wiktionary.org; frame-src 'self' https://open.spotify.com https://sdk.scdn.co https://*.spotify.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,interactive-widget=resizes-content">
<title>Stjärndelfin Yatzy</title>
<meta name="theme-color" content="#071a45">
<meta name="description" content="Svensk Yatzy i rymden och havet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#030a1f;--aqua:#3ee6ff;--teal:#2dd4bf;--lilac:#a78bfa;--pink:#f9a8d4;--gold:#ffd36e;
  --glass:rgba(110,180,255,.10);--glass2:rgba(110,180,255,.16);--line:rgba(140,210,255,.22);
  --txt:#e8f6ff;--dim:#8fb4d8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--txt);font-family:'Fredoka',system-ui,sans-serif}
html{background:var(--deep)}
body{
  background:
    radial-gradient(110% 70% at 85% -10%,rgba(124,92,230,.55) 0%,transparent 55%),
    radial-gradient(120% 60% at 0% 110%,rgba(14,120,180,.75) 0%,transparent 60%),
    linear-gradient(180deg,#030a1f 0%,#071a45 50%,#0a3a6b 100%);
  background-attachment:fixed;min-height:100vh;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}

/* ---------- Himmel & hav ---------- */
#sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.planet{position:absolute;top:-46px;right:-46px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#d5f8ff 0%,#5cc4ff 30%,#4049c9 68%,#1b1460 100%);
  box-shadow:0 0 70px rgba(90,170,255,.45),inset -18px -14px 40px rgba(10,0,60,.55);opacity:.9}
.ring{position:absolute;top:22px;right:-88px;width:270px;height:58px;border-radius:50%;
  border:3px solid rgba(255,211,110,.55);border-top-color:transparent;transform:rotate(-16deg);
  filter:drop-shadow(0 0 6px rgba(255,211,110,.5))}
.moon{position:absolute;top:120px;left:18px;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7e0,#f9a8d4 60%,#a78bfa);opacity:.7;box-shadow:0 0 20px rgba(249,168,212,.5)}
.shoot{position:absolute;width:120px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff);opacity:0;animation:shoot 9s ease-in infinite}
@keyframes shoot{0%,88%{opacity:0;transform:translate(0,0) rotate(-25deg)}90%{opacity:1}100%{opacity:0;transform:translate(-340px,160px) rotate(-25deg)}}
.bubble{position:absolute;bottom:-30px;border-radius:50%;border:1.5px solid rgba(180,240,255,.45);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.55),rgba(120,220,255,.06) 55%);animation:rise linear infinite}
@keyframes rise{to{transform:translate(24px,-112vh)}}
.swimmer{position:absolute;width:120px;opacity:.28;animation:swim linear infinite}
.swimmer svg{width:100%;animation:bob 2.6s ease-in-out infinite}
@keyframes swim{from{transform:translateX(-170px)}to{transform:translateX(calc(100vw + 170px))}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.waves{position:absolute;left:0;right:0;bottom:0;height:120px;opacity:.35}

/* ---------- Layout ---------- */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 12px 260px}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.iconbtn:active{transform:scale(.94)}
.tb-title{flex:1;text-align:center;font-weight:600;letter-spacing:.5px;font-size:16px;color:var(--dim)}
.tb-title b{color:var(--aqua)}

/* ---------- Lobby ---------- */
.logo{text-align:center;margin:26px 0 6px;position:relative}
.logo svg.big{width:150px;filter:drop-shadow(0 0 18px rgba(62,230,255,.55));animation:bob 3s ease-in-out infinite}
.logo h1{margin:4px 0 0;font-size:40px;line-height:1;font-weight:700;
  background:linear-gradient(90deg,#7df9ff,#a78bfa 50%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 12px rgba(125,249,255,.35))}
.logo h1 small{display:block;font-size:20px;letter-spacing:6px;margin-top:4px}
.tag{text-align:center;color:var(--dim);margin:6px 0 4px}
.getwell{text-align:center;margin:10px auto 18px;padding:8px 16px;border-radius:999px;width:max-content;max-width:100%;
  background:rgba(249,168,212,.14);border:1px solid rgba(249,168,212,.35);color:#ffd6ec;font-weight:500}
.chatbtn{position:relative;background:linear-gradient(135deg,#00a884,#0e7490 70%)!important}.chatbtn small{font-size:12px;opacity:.85;margin-left:6px}.chatbtn .badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);min-width:24px;height:24px;border-radius:999px;background:#ef4444;display:grid;place-items:center;font-size:13px;padding:0 7px}
.hrtog{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 2px;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.22);text-align:left;font-size:14px}
.hrtog span{flex:1}.hrtog i{font-style:normal;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(148,163,184,.25)}
.hrtog.on{border-color:#facc15;background:rgba(250,204,21,.12)}.hrtog.on i{background:#facc15;color:#1e1b4b}
.bigbtn{display:block;width:100%;padding:16px 18px;border-radius:22px;font-size:19px;font-weight:600;margin:10px 0;
  background:linear-gradient(135deg,#22d3ee,#6366f1 60%,#a855f7);box-shadow:0 8px 24px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.bigbtn.alt{background:var(--glass2);border:1px solid var(--line);box-shadow:none}
.bigbtn:active{transform:scale(.97)}
.bigbtn:disabled{opacity:.4}
h2.sec{font-size:15px;color:var(--dim);font-weight:500;margin:22px 4px 8px;letter-spacing:1px;text-transform:uppercase}
.gcard{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);margin-bottom:8px;text-align:left;width:100%}
.gcard .gi{flex:1;min-width:0}
.gcard .gn{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gs{font-size:13px;color:var(--dim)}
.gcard .gs.hot{color:var(--gold)}
.gcard .go{font-size:22px}
.gcard .del{font-size:13px;color:var(--dim);padding:6px 8px;border-radius:10px}
.gcard .del.armed{background:rgba(255,90,120,.25);color:#ffc2cf}
.note{color:var(--dim);font-size:14px;text-align:center;padding:12px;border-radius:16px;background:rgba(0,0,0,.18)}

/* ---------- Spelare ---------- */
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pl{position:relative;padding:10px 12px;border-radius:20px;background:var(--glass);border:1px solid var(--line);transition:.3s}
.pl.on{background:linear-gradient(135deg,rgba(34,211,238,.28),rgba(168,85,247,.28));border-color:rgba(125,249,255,.7);
  box-shadow:0 0 22px rgba(62,230,255,.35)}
.pl .pn{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .pt{font-size:30px;font-weight:700;line-height:1.05}
.pl .pm{font-size:12px;color:var(--dim)}
.pl.on .pm{color:var(--aqua)}
.pl .me{position:absolute;top:8px;right:10px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(255,211,110,.2);color:var(--gold)}

/* ---------- Protokoll ---------- */
.card{border-radius:22px;background:rgba(6,20,55,.55);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:hidden}
.row{display:grid;grid-template-columns:1fr repeat(var(--n,2),var(--cw,70px));align-items:center;min-height:36px;border-bottom:1px solid rgba(140,210,255,.09)}
.row:last-child{border-bottom:0}
.row.head{min-height:34px;background:rgba(62,230,255,.08);font-size:13px;color:var(--dim)}
.row.head div{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.row.head div.mine{color:var(--gold)}
.row .cn{padding:0 12px;font-size:15px;display:flex;align-items:center;gap:8px;height:100%;text-align:left}
.row .cn .mini{width:16px;height:16px;border-radius:4px;background:#bdefff;display:inline-grid;grid-template-columns:repeat(3,1fr);padding:2px;gap:1px;flex:none}
.row .cn .mini i{border-radius:50%}
.row .cn .mini i.on{background:#0b2a5c}
.row .c{text-align:center;font-size:17px;font-weight:600;height:100%;display:grid;place-items:center;border-left:1px solid rgba(140,210,255,.09)}
.row .c.col-on{background:rgba(62,230,255,.06)}
.row .c.z{color:rgba(232,246,255,.35)}
.row .c.new{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4);color:var(--gold)}60%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}
.pv{width:58px;height:28px;border-radius:12px;font-size:16px;font-weight:600;color:#7df9ff;
  background:rgba(62,230,255,.12);border:1.5px dashed rgba(125,249,255,.55)}
.pv.zero{color:rgba(232,246,255,.45);border-color:rgba(232,246,255,.2);background:transparent}
.pv.best{background:linear-gradient(135deg,rgba(255,211,110,.35),rgba(249,168,212,.3));border:1.5px solid var(--gold);color:#fff3c9;
  box-shadow:0 0 12px rgba(255,211,110,.45);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 20px rgba(255,211,110,.8)}}
.pv:active{transform:scale(.92)}
.row.sum{background:rgba(167,139,250,.10);font-size:14px;min-height:32px}
.row.sum .cn{color:#d9cdff;font-size:14px}
.row.sum .c{font-size:15px}
.row.total{background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(168,85,247,.18));min-height:44px}
.row.total .cn{font-weight:700;font-size:17px}
.row.total .c{font-size:21px;font-weight:700}
.bon{font-size:12px;color:var(--dim);font-weight:500}
.bon.ok{color:var(--gold);font-size:15px;font-weight:700}

/* ---------- Dock (tärningar) ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(3,10,31,0) 0%,rgba(4,18,52,.88) 22%,rgba(6,30,75,.97) 100%)}
.dock-in{max-width:520px;margin:0 auto}
.status{text-align:center;font-size:clamp(13px,4.1vw,16px);font-weight:500;min-height:24px;margin:6px 0 10px;color:#cdeeff}
.status b{color:var(--aqua)}
.dice{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.die{position:relative;width:min(60px,calc((100vw - 64px)/5));aspect-ratio:1;border-radius:16px;padding:0;
  background:linear-gradient(145deg,#f2fdff 0%,#a5e9ff 45%,#53b8f5 100%);
  box-shadow:0 6px 0 #1e5fa8,0 10px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.9);
  transition:transform .18s ease,box-shadow .18s ease,opacity .25s}
.die .face{position:absolute;inset:12%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}
.die .face i{width:62%;aspect-ratio:1;border-radius:50%}
.die .face i.on{background:radial-gradient(circle at 35% 35%,#3b6bd6,#0b2a5c 70%);box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.die.held{transform:translateY(-8px);
  background:linear-gradient(145deg,#fff9e6 0%,#ffe08a 50%,#f9a8d4 100%);
  box-shadow:0 6px 0 #b35f9a,0 0 0 3px rgba(255,211,110,.9),0 0 26px rgba(255,211,110,.7)}
.die.held .face i.on{background:radial-gradient(circle at 35% 35%,#8b5cf6,#3b0f73 70%)}
.die em{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-style:normal;font-size:14px}
.die.idle{opacity:.38;box-shadow:0 4px 0 #1e5fa8}
.die.roll{animation:tumble .14s linear infinite}
@keyframes tumble{0%{transform:rotate(-14deg) translateY(-6px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-14deg) translateY(-6px)}}
.die:active:not(.idle){transform:scale(.93)}
.rollrow{display:flex;gap:10px;align-items:center}
.rollbtn{flex:1;min-width:0;height:58px;border-radius:22px;font-size:clamp(16px,5.2vw,21px);white-space:nowrap;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#22d3ee,#6366f1 60%,#a855f7);
  box-shadow:0 6px 0 #3730a3,0 12px 26px rgba(99,102,241,.5),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .1s}
.rollbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #3730a3,0 6px 14px rgba(99,102,241,.5)}
.rollbtn:disabled{filter:grayscale(.7) brightness(.7);box-shadow:none}
.pips{display:flex;gap:6px;padding:0 6px}
.pips span{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(180,240,255,.6);
  background:radial-gradient(circle at 30% 30%,#fff,#7df9ff 45%,#0891b2)}
.pips span.used{background:transparent;opacity:.35}

/* ---------- Toast, modal, fest ---------- */
#toasts{position:fixed;top:12px;left:0;right:0;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:10px 16px;border-radius:999px;background:rgba(10,30,80,.92);border:1px solid rgba(125,249,255,.5);
  box-shadow:0 8px 24px rgba(0,0,0,.4);font-weight:500;max-width:92vw;text-align:center;animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateY(-12px) scale(.9)}}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,20,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal.show{display:flex}
.sheet{width:100%;max-width:400px;padding:22px;border-radius:26px;background:linear-gradient(160deg,#0d2a66,#1a1650);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);animation:tin .25s}
.sheet h3{margin:0 0 6px;font-size:22px}
.sheet p{margin:0 0 14px;color:var(--dim)}
.sheet label{display:block;font-size:13px;color:var(--dim);margin:10px 2px 4px}
.sheet input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--txt);font-size:18px;outline:none}
.sheet input:focus{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(62,230,255,.2)}
.seg{display:flex;gap:8px;margin-top:4px}
.seg button{flex:1;padding:10px 6px;border-radius:14px;background:rgba(0,0,0,.25);border:1.5px solid var(--line);font-size:15px;font-weight:500;line-height:1.2}
.seg button small{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:2px}
.seg button.sel{border-color:var(--aqua);background:rgba(62,230,255,.16);box-shadow:0 0 14px rgba(62,230,255,.35)}
.modetag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(167,139,250,.22);color:#d9cdff;margin-left:6px;vertical-align:middle}
.row .cn.next{color:var(--gold)}
.tb-title .net{font-size:11px;font-weight:500;color:var(--dim);margin-top:1px}
.tb-title .net.ns-connected{color:#86efac}
.tb-title .net.ns-lost{color:#fda4af}
.sheet input.codein{font-size:30px;letter-spacing:12px;text-align:center;font-weight:700;text-transform:uppercase;color:var(--aqua)}
.turnbanner{position:fixed;left:50%;top:40%;z-index:36;padding:18px 28px;border-radius:28px;text-align:center;pointer-events:none;
  background:linear-gradient(135deg,rgba(34,211,238,.95),rgba(168,85,247,.95));font-size:26px;font-weight:700;white-space:nowrap;
  box-shadow:0 0 60px rgba(62,230,255,.6),0 10px 30px rgba(0,0,0,.4);animation:tb 2s ease forwards}
.turnbanner small{display:block;font-size:40px;line-height:1.1}
@keyframes tb{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-62%)}}
.setrow{margin:12px 0 0}
.setrow .lbl{font-size:13px;color:var(--dim);margin:0 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 12px;border-radius:999px;background:rgba(0,0,0,.25);border:1.5px solid var(--line);font-size:15px}
.chips button.sel{border-color:var(--aqua);background:rgba(62,230,255,.16);box-shadow:0 0 12px rgba(62,230,255,.35)}
.setnote{font-size:12px;color:var(--dim);margin-top:6px}
.sheet{max-height:92vh;overflow:auto}
#bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
body:not(.ingame) #app, body:not(.ingame) #app .lobby, body:not(.ingame) #app .lob-hero, body:not(.ingame) #app .logo, body:not(.ingame) #app .topbar,
body:not(.ingame) #app .tag, body:not(.ingame) #app h2, body:not(.ingame) #app .duo, body:not(.ingame) #app .tb-title{pointer-events:none}
body:not(.ingame) #app button, body:not(.ingame) #app .note, body:not(.ingame) #app .getwell, body:not(.ingame) #app .bgcard, body:not(.ingame) #app .popc, body:not(.desk) #app .lob-menu > *{pointer-events:auto}
body:not(.desk):not(.ingame) #app .lob-menu{pointer-events:none}
.pbub{position:absolute;bottom:-90px;border-radius:50%;pointer-events:auto;cursor:pointer;touch-action:manipulation;
  border:2px solid rgba(190,245,255,.7);background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.75),rgba(140,230,255,.18) 38%,rgba(90,170,255,.08) 70%);
  box-shadow:inset 0 0 12px rgba(170,240,255,.35),0 0 14px rgba(62,230,255,.25);animation:pbrise linear forwards;display:grid;place-items:center}
.pbub i{font-style:normal;font-size:55%;filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
.pbub.gold{border-color:rgba(255,215,120,.95);background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.85),rgba(255,211,110,.35) 40%,rgba(255,170,60,.12) 72%);box-shadow:0 0 22px rgba(255,211,110,.6)}
.pbub.pink{border-color:rgba(249,168,212,.9);background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.8),rgba(249,168,212,.3) 40%,rgba(167,139,250,.12) 72%);box-shadow:0 0 18px rgba(249,168,212,.5)}
@keyframes pbrise{0%{transform:translate(0,0)}25%{transform:translate(var(--sway),-30vh)}50%{transform:translate(calc(var(--sway)*-1),-60vh)}75%{transform:translate(var(--sway),-90vh)}100%{transform:translate(0,-125vh)}}
.popring{position:fixed;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(200,248,255,.9);animation:pr .42s ease-out forwards;pointer-events:none}
@keyframes pr{from{transform:translate(-50%,-50%) scale(.8);opacity:1}to{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
.drop{position:fixed;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#c9f6ff;box-shadow:0 0 8px #7df9ff;animation:dr .5s ease-out forwards;pointer-events:none}
@keyframes dr{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.popc{min-width:40px;height:40px;padding:0 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:15px}
.popc.bump{animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.25);color:var(--aqua)}}
.sp-tab{position:fixed;right:0;top:42%;z-index:24;width:42px;height:58px;border-radius:18px 0 0 18px;font-size:22px;
  background:linear-gradient(135deg,rgba(30,215,96,.9),rgba(14,165,233,.9));box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 18px rgba(30,215,96,.35);transition:right .35s ease}
.sp-tab.open{right:min(360px,88vw)}
.ingame .sp-tab:not(.open){display:none}
.iconbtn.sp-on{box-shadow:0 0 14px rgba(30,215,96,.6);border-color:#1ed760}
.sp-tab.playing{animation:spp 1.6s ease-in-out infinite}
@keyframes spp{50%{box-shadow:0 0 30px rgba(30,215,96,.8)}}
.sp-panel{position:fixed;top:0;right:0;bottom:0;z-index:25;width:min(360px,88vw);padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;
  background:linear-gradient(170deg,rgba(9,30,78,.97),rgba(20,16,70,.97));border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.5);
  transform:translateX(102%);transition:transform .35s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sp-panel.open{transform:none}
.sp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:17px}
.sp-row{display:flex;gap:8px}
.sp-row input{flex:1;min-width:0;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--txt);font-size:15px;outline:none}
.sp-row input:focus{border-color:#1ed760}
.sp-go{padding:0 16px;border-radius:14px;font-weight:600;background:linear-gradient(135deg,#1ed760,#0ea5e9)}
.sp-wrap{border-radius:14px;overflow:hidden;min-height:80px}
.sp-wrap iframe{display:block;border:0;border-radius:14px}
.sp-empty{padding:28px 10px;text-align:center;color:var(--dim);border:1.5px dashed var(--line);border-radius:14px}
.sp-recent{display:flex;flex-wrap:wrap;gap:6px}
.sp-recent button{padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:13px}
.sp-recent button span{color:var(--dim)}
.sp-recent button.sel{border-color:#1ed760}
.sp-duck{margin-top:14px;font-size:13px;color:var(--dim)}
.sp-login{width:100%;padding:14px;border-radius:999px;font-size:17px;font-weight:700;background:#1ed760;color:#06210f;box-shadow:0 6px 20px rgba(30,215,96,.35)}
.sp-acct{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.sp-acct button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:rgba(0,0,0,.2)}
.sp-nowbox{margin-top:10px;padding:12px;border-radius:18px;background:rgba(0,0,0,.25);border:1px solid rgba(30,215,96,.35)}
.sp-now{display:flex;gap:12px;align-items:center}
.sp-now img,.sp-noimg{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:26px}
.sp-meta{min-width:0;display:flex;flex-direction:column}
.sp-meta b,.sp-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-meta span{font-size:13px;color:#cdeeff}
.sp-meta small{font-size:11px;color:#86efac;margin-top:2px}
.sp-ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px}
.sp-ctl button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);font-size:18px}
.sp-ctl button.big{width:56px;height:56px;font-size:22px;background:#1ed760}
.sp-ctl button.on{box-shadow:0 0 0 2px #1ed760}
.sp-vol{width:100%;margin-top:10px;accent-color:#1ed760}
.sp-lists{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp-lists button{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);text-align:left}
.sp-lists button:active{transform:scale(.96)}
.sp-lists img,.sp-lists .sp-noimg{width:100%;height:auto;aspect-ratio:1;border-radius:10px;object-fit:cover}
.sp-lists span{font-size:13px;font-weight:500;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp-duck .seg{margin-top:6px}
.lobbyp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.lobbyp span{padding:6px 12px;border-radius:999px;background:rgba(62,230,255,.14);border:1px solid rgba(125,249,255,.4);font-weight:500}
.lobbyp span.me{border-color:var(--gold);color:#fff3c9}
.lobbyp span.empty{background:transparent;border-style:dashed;color:var(--dim);font-weight:400}
.slot{margin-top:10px;padding:10px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid rgba(140,210,255,.12)}
.slotrow{display:flex;gap:8px;margin-bottom:8px}
.slot input:disabled{opacity:.55}
.slot .chips{flex-wrap:nowrap;gap:6px}
.slot .chips button{flex:1;padding:8px 4px;font-size:14px;white-space:nowrap}
.slot .x{width:46px;flex:none;border-radius:14px;background:rgba(255,90,120,.2);font-size:16px}
.addslot{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1.5px dashed var(--line);font-size:16px;background:transparent}
.card.many .row .cn{font-size:14px;padding:0 8px;gap:6px}
.card.many .row .c{font-size:15px}
.card.many .pv{width:calc(var(--cw) - 6px);font-size:15px;height:26px}
.card.many .row.head div{font-size:12px;padding:0 2px}
.card.many .row.total .c{font-size:17px}
.card.many .bon{font-size:10.5px}
.card.many .row.total .cn{font-size:16px}
.players.many .pl{padding:7px 10px}
.players.many .pt{font-size:22px}
.players.many .pn{font-size:14px}
.res-rank{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.res-p{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.res-p.win{background:linear-gradient(135deg,rgba(255,211,110,.25),rgba(249,168,212,.18));border-color:rgba(255,211,110,.7)}
.res-p .pos{font-size:24px;text-align:center}
.res-p .nm{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-p .sub{font-size:12px;color:var(--dim);font-weight:400}
.res-p .sc{font-size:28px;font-weight:700}
.res-hl{font-size:14px;color:#cdeeff;margin:10px 2px 0;line-height:1.5}
.res-hl b{color:var(--gold)}
.stats h2.sec{margin-top:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:10px 6px;border-radius:16px;background:var(--glass);border:1px solid var(--line);text-align:center}
.kpi b{display:block;font-size:24px}
.kpi span{font-size:12px;color:var(--dim)}
.stbl{border-radius:18px;background:rgba(6,20,55,.55);border:1px solid var(--line);overflow:hidden}
.stbl .tr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid rgba(140,210,255,.09);font-size:15px}
.stbl .tr:last-child{border-bottom:0}
.stbl .tr.h{font-size:12px;color:var(--dim);background:rgba(62,230,255,.07)}
.stbl .tr .r{text-align:right;font-weight:600;white-space:nowrap}
.stbl .tr .m{color:var(--dim);font-size:13px;white-space:nowrap}
.stbl .tr .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl{font-weight:600}.wl .w{color:#86efac}.wl .f{color:#fda4af}.wl .o{color:var(--dim)}
.reactbtn{width:58px;height:58px;flex:none;border-radius:20px;font-size:28px;background:var(--glass2);border:1px solid var(--line)}
.reactbtn.on{border-color:var(--aqua);box-shadow:0 0 16px rgba(62,230,255,.45)}
.reactbtn.wide{width:auto;flex:1;font-size:18px;font-weight:600}
.reactbtn:active{transform:scale(.92)}
.tray{display:none;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:10px;padding:10px;border-radius:22px;background:rgba(8,25,70,.94);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.tray.open{display:flex;animation:tin .2s}
.tray .emo{font-size:30px;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.07)}
.tray .emo:active{transform:scale(.8)}
.tray .poke{width:100%;padding:12px;border-radius:16px;font-size:17px;font-weight:600;background:linear-gradient(135deg,#f472b6,#a855f7);box-shadow:0 4px 0 #7e22ce}
.tray .poke:active{transform:translateY(3px);box-shadow:none}
.floatemo{position:absolute;bottom:-70px;font-size:var(--s);line-height:1;animation:floatup var(--d) cubic-bezier(.25,.6,.45,1) both}
.floatemo span{display:inline-block;animation:wob 1.3s ease-in-out infinite}
@keyframes floatup{0%{transform:translate(0,0) scale(.5);opacity:0}8%{opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),-108vh) scale(1.2) rotate(var(--r));opacity:0}}
@keyframes wob{0%,100%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.sheet .btns{display:flex;gap:10px;margin-top:16px}
.sheet .btns button{flex:1;padding:13px;border-radius:16px;font-size:17px;font-weight:600;background:var(--glass2);border:1px solid var(--line)}
.sheet .btns button.pri{background:linear-gradient(135deg,#22d3ee,#6366f1);border:0}
#party{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}
.ytext{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:72px;font-weight:700;letter-spacing:2px;
  background:linear-gradient(90deg,#7df9ff,#ffd36e,#f9a8d4,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(125,249,255,.7));animation:yt 2.6s ease forwards;white-space:nowrap}
@keyframes yt{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25) rotate(4deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}
.jumper{position:absolute;bottom:-120px;left:-160px;width:170px;animation:jump 2.4s ease-in-out forwards}
.jumper svg{width:100%;filter:drop-shadow(0 0 16px rgba(62,230,255,.8))}
@keyframes jump{0%{transform:translate(0,0) rotate(-40deg)}50%{transform:translate(calc(50vw + 80px),-62vh) rotate(5deg)}100%{transform:translate(calc(100vw + 340px),0) rotate(45deg)}}
.spark{position:absolute;font-size:22px;animation:burst 1.6s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r));opacity:0}}

.over{text-align:center;padding:22px 16px;margin-bottom:12px;border-radius:24px;
  background:linear-gradient(135deg,rgba(255,211,110,.2),rgba(168,85,247,.25));border:1px solid rgba(255,211,110,.55)}
.over .tr{font-size:52px}
.over h2{margin:4px 0;font-size:28px}
.over p{margin:0 0 10px;color:#d9e9ff}
.waiting{text-align:center;padding:18px;border-radius:22px;background:var(--glass);border:1px dashed rgba(125,249,255,.5);margin-bottom:12px}
.waiting .code{font-size:30px;font-weight:700;letter-spacing:6px;color:var(--aqua)}
.loading{text-align:center;padding:60px 0;color:var(--dim)}
.loading svg{width:110px;animation:bob 1.6s ease-in-out infinite;opacity:.8}
/* =====================================================================
   DATORLAYOUT – slår bara på i breda fönster (body.desk)
   ===================================================================== */
:focus-visible{outline:2px solid var(--aqua);outline-offset:3px;border-radius:12px}
body.desk #app{max-width:1280px;padding:26px clamp(16px,3vw,40px) 48px}
body.desk .topbar{margin-bottom:22px}
body.desk .tb-title{font-size:18px}
body.desk .iconbtn{width:46px;height:46px;border-radius:16px;font-size:20px}
body.desk .planet{width:300px;height:300px;top:-90px;right:-80px}
body.desk .ring{width:480px;height:96px;top:40px;right:-170px}
body.desk .moon{width:40px;height:40px;top:200px;left:60px}
body.desk .swimmer{width:190px}

/* Spelvy: protokoll till vänster, kontrollpanel till höger */
.desk-grid{display:grid;grid-template-columns:minmax(0,1fr) clamp(370px,34vw,460px);gap:clamp(18px,2.4vw,32px);align-items:start}
.desk-left{min-width:0}
.desk-right{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;overflow-x:hidden;
  padding:20px;border-radius:30px;background:linear-gradient(165deg,rgba(14,40,100,.62),rgba(22,14,70,.55));
  border:1px solid rgba(140,210,255,.22);box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);scrollbar-width:thin}
.desk-right .players{margin-bottom:16px}
.desk-right .pl{padding:12px 16px}
.desk-right .pt{font-size:36px}
.desk-right .players.many .pt{font-size:28px}
.desk-right .pn{font-size:16px}
.desk-right .over,.desk-right .waiting{margin-bottom:16px}
.desk-right .dock{position:static;padding:0;background:none}
.desk-right .dock-in{max-width:none}
.desk-right .status{font-size:17px;margin:4px 0 16px;min-height:26px}
.desk-right .dice{gap:12px;margin-bottom:20px}
.desk-right .dice{gap:clamp(8px,1vw,12px)}
.desk-right .die{width:min(74px,calc((100% - 48px)/5));border-radius:20px}
.desk-right .die em{bottom:-24px;font-size:16px}
.desk-right .rollbtn{height:66px;font-size:23px;border-radius:24px}
.desk-right .reactbtn{width:66px;height:66px;border-radius:22px}
.desk-right .tray{margin-bottom:14px}
.kbhint{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:16px;font-size:12px;color:var(--dim)}
.kbhint span{white-space:nowrap}
kbd{display:inline-block;min-width:22px;padding:1px 6px;margin-right:4px;border-radius:7px;font:600 11px/18px 'Fredoka',system-ui,sans-serif;text-align:center;
  color:#dff6ff;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(180,230,255,.3);box-shadow:0 2px 0 rgba(0,0,0,.35)}

/* Större, luftigare protokoll */
body.desk .desk-left .card{border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
body.desk .desk-left .row{min-height:46px;grid-template-columns:1fr repeat(var(--n,2),var(--cwd,110px))}
body.desk .desk-left .card.many .row{grid-template-columns:1fr repeat(var(--n,2),var(--cwd,92px))}
body.desk .desk-left .row .cn{font-size:18px;padding:0 18px;gap:12px}
body.desk .desk-left .row .cn .mini{width:20px;height:20px}
body.desk .desk-left .row .c{font-size:20px}
body.desk .desk-left .row.head{min-height:44px;font-size:15px}
body.desk .desk-left .row.head div{font-size:15px}
body.desk .desk-left .row.sum{min-height:40px}
body.desk .desk-left .row.sum .cn,body.desk .desk-left .row.sum .c{font-size:16px}
body.desk .desk-left .row.total{min-height:58px}
body.desk .desk-left .row.total .cn{font-size:20px}
body.desk .desk-left .row.total .c{font-size:26px}
body.desk .desk-left .pv{width:calc(var(--cwd,110px) - 22px);height:34px;font-size:18px;border-radius:13px}
body.desk .desk-left .card.many .pv{width:calc(var(--cwd,92px) - 16px)}
body.desk .desk-left .bon{font-size:13px}
.pv.kb{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 22px rgba(255,255,255,.55)!important}

/* Lobby: hjälte till vänster, meny till höger */
body.desk .lobby{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center;min-height:calc(100vh - 150px)}
body.desk .lob-hero{text-align:center}
body.desk .lob-hero .logo{margin:0}
body.desk .lob-hero .logo svg.big{width:300px}
body.desk .lob-hero .logo h1{font-size:76px}
body.desk .lob-hero .logo h1 small{font-size:30px;letter-spacing:12px;margin-top:8px}
body.desk .lob-hero .tag{font-size:20px;margin-top:14px}
body.desk .lob-hero .getwell{font-size:18px;padding:10px 22px;margin-top:18px}
body.desk .lob-menu{padding:26px 28px;border-radius:30px;background:linear-gradient(165deg,rgba(14,40,100,.55),rgba(22,14,70,.5));
  border:1px solid rgba(140,210,255,.2);box-shadow:0 24px 60px rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.desk .lob-menu h2.sec:first-child{margin-top:4px}
body.desk .lob-menu .bigbtn{padding:15px 18px;font-size:18px}
body.desk .lob-menu .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.desk .lob-menu .duo .bigbtn{margin:6px 0}

/* Statistik i två spalter */
body.desk .stats{max-width:1100px;margin:0 auto}
body.desk .stats .kpis{grid-template-columns:repeat(4,1fr);gap:14px}
body.desk .stats .kpi{padding:18px 8px}
body.desk .stats .kpi b{font-size:34px}
body.desk .stat-cols{columns:2;column-gap:32px}
body.desk .stat-cols section{break-inside:avoid;display:inline-block;width:100%;margin-bottom:6px}

/* Modaler lite större */
body.desk .sheet{max-width:500px;padding:28px}

/* Spotify-panelen trycker undan innehållet på riktigt breda skärmar */
@media (min-width:1500px){
  body.desk.sp-wide #app{margin-right:400px;transition:margin .35s ease}
  body.desk.sp-wide .sp-tab.open{display:none}
}
body.desk .sp-panel{width:380px}
body.desk .sp-tab.open{right:380px}

/* Mus: fina hovereffekter */
@media (hover:hover) and (pointer:fine){
  .bigbtn,.rollbtn,.iconbtn,.reactbtn,.pv,.die,.gcard,.chips button,.seg button,.sp-lists button,.emo,.tray .poke{transition:transform .15s ease,filter .15s ease,box-shadow .2s ease,background .2s ease}
  .bigbtn:hover{filter:brightness(1.12);transform:translateY(-2px)}
  .bigbtn.alt:hover{background:rgba(110,180,255,.24)}
  .iconbtn:hover,.reactbtn:hover{background:rgba(110,180,255,.24);transform:translateY(-1px)}
  .rollbtn:not(:disabled):hover{filter:brightness(1.1) saturate(1.1);transform:translateY(-2px)}
  .die:not(.idle):hover{transform:translateY(-6px) rotate(-3deg);cursor:pointer}
  .die.held:hover{transform:translateY(-12px) rotate(2deg)}
  .pv:hover{transform:scale(1.08);background:rgba(62,230,255,.25);border-style:solid}
  .row:not(.head):not(.sum):not(.total):hover{background:rgba(62,230,255,.05)}
  .row .cn:hover{color:var(--aqua)}
  .chips button:hover,.seg button:hover,.sp-lists button:hover{border-color:rgba(125,249,255,.7)}
  .emo:hover{transform:scale(1.15) rotate(-6deg)}
  .pbub:hover{filter:brightness(1.25);transform:scale(1.08)}
  button,.pbub{cursor:pointer}
}

/* ================= PATIENS ================= */
.sol{position:relative}
.sol .tb-title .net{margin-top:3px}
.yzpill{font:inherit;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(62,230,255,.14);border:1px solid rgba(125,249,255,.35);color:#cdeeff}
.yzpill.hot{background:linear-gradient(135deg,#f472b6,#a855f7);color:#fff;border-color:transparent;animation:yzp 1.2s ease-in-out infinite}
@keyframes yzp{50%{box-shadow:0 0 18px rgba(244,114,182,.8);transform:scale(1.05)}}
.sol-info{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 16px;font-size:14px;color:#cdeeff;margin:2px 0 14px}
.sol-info .chip{padding:3px 10px;border-radius:999px;background:rgba(167,139,250,.22);color:#e9ddff;font-weight:600;font-size:13px}
.sol-info .dim{color:var(--dim)}
.sol-board{position:relative;width:100%;max-width:880px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;min-height:300px}
body.desk .sol-board{max-width:980px}
.sol-board .slot{position:absolute;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.11);border:2px dashed rgba(190,235,255,.28);
  background:rgba(255,255,255,.04);display:grid;place-items:center;color:rgba(220,245,255,.32);font-weight:700;font-size:calc(var(--cw)*.36)}
.sol-board .slot.stock{border-style:solid;cursor:pointer}
.sol-board .slot.stock span{opacity:0;transition:opacity .2s}
.sol-board .slot.stock.empty span{opacity:1;color:rgba(220,245,255,.65);font-size:calc(var(--cw)*.5)}
